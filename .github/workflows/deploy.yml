name: Build and Deploy Photo Stream

on:
  push:
    branches: ["main"]

# Allow GITHUB_TOKEN to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install PhotoStream Image & Video Dependencies
        run: |
            sudo apt-get update
            sudo apt-get install -y \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout="30" \
              --no-install-recommends \
              libvips-dev \
              libheif-dev \
              libjpeg-dev \
              libpng-dev \
              ffmpeg

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      
      - name: Install Jekyll
        run: gem install jekyll
      
      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Photo Stream with Jekyll
        run: jekyll build --destination ./_site
        env:
          JEKYLL_ENV: production

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
