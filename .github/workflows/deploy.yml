name: Build and Deploy Afilmory

on:
  push:
    branches: ["main", "afilmory"]
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build with Docker
        run: docker run -v "$PWD/config.yaml:/config/config.yaml" -v "$PWD/photos:/data/photos" -v "$PWD/output:/output" gfrison/afilmory-builder:latest

      - name: Fix output permissions
        run: sudo chmod -R ugo+rX output && sudo chown -R runner:runner output

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./output"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
