name: Build and Deploy Photo Stream

on:
  push:
    branches: ["main"]

# Allow GITHUB_TOKEN to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Photo Stream with Docker image
        run: |
          mkdir -p _site
          docker run --rm \
            --env-file .env \
            -v "$PWD/photos:/photo-stream/photos" \
            -v "$PWD/_site:/photo-stream/_site" \
            --entrypoint bundle \
            waschinski/photo-stream:latest \
            exec jekyll build --baseurl /photos

      - name: Fix artifact permissions
        run: sudo chown -R "$USER" _site

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
